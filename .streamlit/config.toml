[theme]
base = "light"
primaryColor = "#1d4ed8"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f8fc"
textColor = "#0f172a"
linkColor = "#1d4ed8"
borderColor = "#dfe7f1"
codeBackgroundColor = "#f1f5f9"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
baseRadius = "0.65rem"
buttonRadius = "0.55rem"
showWidgetBorder = true
showSidebarBorder = true
baseFontSize = 15
headingFontSizes = ["32px", "24px", "20px", "17px", "15px", "13px"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
metricValueFontSize = "2rem"
metricValueFontWeight = 700
linkUnderline = false
paddingTop = "1.5rem"
paddingBottom = "2rem"
chartCategoricalColors = ["#1d4ed8", "#0f766e", "#7c3aed", "#b45309", "#be123c", "#0369a1", "#475569"]

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f8fc"
textColor = "#0f172a"
borderColor = "#dfe7f1"
primaryColor = "#1d4ed8"
linkColor = "#1d4ed8"
paddingTop = "1rem"
paddingBottom = "1rem"
showWidgetBorder = true

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false
